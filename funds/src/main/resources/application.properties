spring.application.name=funds

# --- database (local dev: a "funds" database; scripts/live will start one later)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/funds}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.flyway.enabled=true

# --- JSON + errors: every error leaves as {"error":...}, never HTML
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false
server.error.include-message=never
server.error.include-stacktrace=never
server.server-header=

# --- ports: 8083 public (/v2/funds/**), 8084 internal (/internal/**, loopback by default)
server.port=${SERVER_PORT:8083}
funds.internal-port=${INTERNAL_PORT:8084}
funds.internal-bind-address=${INTERNAL_BIND_ADDRESS:127.0.0.1}

# --- limits
# largest single transfer, in paise (default Rs 1,00,00,000.00)
funds.max-transfer-minor=${MAX_TRANSFER_MINOR:1000000000}

# --- auth: same rules and sources as the order gateway
funds.auth.jwks-url=${JWKS_URL:http://127.0.0.1:8082/.well-known/jwks.json}
funds.auth.jwt-issuer=${JWT_ISSUER:protrader-identity}
# auth currently stamps every access token with aud=order-gateway; Funds accepts that until auth issues an audience list
funds.auth.jwt-audience=${JWT_AUDIENCE:order-gateway}
funds.auth.jwks-refresh=${JWKS_REFRESH:5m}
# a file path or an http(s) URL (auth's internal key snapshot)
funds.auth.api-keys-source=${API_KEYS_SOURCE:http://127.0.0.1:8081/internal/v1/api-keys}
funds.auth.api-keys-poll=${API_KEYS_POLL:30s}

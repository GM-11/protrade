syntax = "proto3";
package exchange.v1;

service Sequencer {
  // Cash owner -> sequencer. One long-lived stream per caller.
  rpc Submit(stream SubmitRequest) returns (stream SubmitAck);
  // Engine <- sequencer. One stream per partition.
  rpc Subscribe(SubscribeRequest) returns (stream SequencedCommand);
}

message SubmitRequest {
  string gateway_id = 1;
  uint64 client_request_id = 2; // random uint64 made by the client; unique only within one account
  uint32 symbol = 3; // the ONLY field the sequencer reads
  bytes payload = 4; // an encoded CommandBody; the sequencer never opens it
  uint64 account_id = 5; // stamped by the order gateway from the verified token
}

enum SubmitStatus {
  SUBMIT_STATUS_UNSPECIFIED = 0;
  SUBMIT_STATUS_ACCEPTED = 1; // relay: queued. Later: durable on disk.
  SUBMIT_STATUS_UNKNOWN_SYMBOL = 2;
  SUBMIT_STATUS_BUSY = 3; // queue full; retry later
  SUBMIT_STATUS_NOT_RUNNING = 4;
}

message SubmitAck {
  uint64 client_request_id = 1; // random uint64 made by the client; unique only within one account
  SubmitStatus status = 2;
  uint64 seq = 3; // set only when ACCEPTED
  uint64 account_id = 4; // stamped by the order gateway from the verified token
}

message SubscribeRequest {
  uint32 partition = 1;
  uint64 from_seq = 2; // first seq wanted. 0 = live (from the next one).
}

message SequencedCommand {
  uint64 seq = 1; // per partition, starts at 1, no gaps
  int64 ts = 2; // the sequencer's clock, milliseconds
  uint32 symbol = 3;
  uint64 client_request_id = 4; // random uint64 made by the client; unique only within one account
  string gateway_id = 5; // so replies can find their way back later
  bytes payload = 6;
  uint64 account_id = 7; // stamped by the order gateway from the verified token
}

// proto/exchange/v1/cash_owner.proto
syntax = "proto3";
package exchange.v1;

import "exchange/v1/commands.proto";

service CashOwner {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderAck); // unary first; stream later
}

message PlaceOrderRequest {
  uint64 account_id = 1; // stamped by the order gateway from the verified token
  uint64 client_request_id = 2; // random uint64 made by the client; key = (account_id, client_request_id)
  uint32 symbol = 3;
  Side side = 4;
  int64 price_paise = 5;
  int64 quantity = 6;
  string gateway_id = 7; // added by the adapter, not by core
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_INSUFFICIENT_CASH = 1;
  REJECT_INSUFFICIENT_HOLDINGS = 2;
}

message PlaceOrderAck {
  bool accepted = 1; // true = cash locked and forwarded, NOT filled
  RejectReason reason = 2; // set only when accepted == false
  int64 shortfall_paise = 3; // optional detail for INSUFFICIENT_CASH
}
